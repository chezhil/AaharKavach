AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  AaharKavach — serverless backend.
  Profiles (Cedar-gated), barcode/label scanning, agent evaluation,
  compare and scan history.

Parameters:
  JwtSecret:
    Type: String
    NoEcho: true
    Description: Secret key used to sign JWT tokens. Do not use default in production.
    Default: "super_secret_dev_key"
  UseAgent:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Route reasoning through Role 1's Strands agent.
  ModelId:
    Type: String
    Default: ""
    Description: >
      Model to ask for. Leave blank to use the provider's own default.
  GroqApiKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: >
      Reasoning provider for the Strands agent. Free tier at
      console.groq.com/keys. Leave blank to run the deterministic rulebook
      instead of the agent.

Globals:
  Function:
    Timeout: 29
    MemorySize: 512
    Runtime: python3.11
    Architectures:
      - x86_64
    Environment:
      Variables:
        PROFILES_TABLE: !Ref ProfilesTable
        HISTORY_TABLE: !Ref HistoryTable
        EXPLANATIONS_TABLE: !Ref ExplanationsTable
        AAHAR_HOUSEHOLD_ID: hh_1
        # Every function builds a Caller, and a Caller verifies the bearer
        # token — so every function needs the signing key, not just the one
        # that issues tokens. Set on AuthFunction alone, the others decoded
        # with the default secret, the signature check failed, the exception
        # was swallowed and the request silently fell back to the default
        # household: a signed-in user saw someone else's profiles and scans.
        # It only looked fine while JwtSecret was left at its default, because
        # then every function happened to share the same wrong key.
        JWT_SECRET: !Ref JwtSecret
        # Set to "true" and give GroqApiKey a key to route reasoning through
        # Role 1's Strands agent. Left off — or with no key — the deterministic
        # rulebook answers instead, which is a safe default rather than an error.
        AAHAR_USE_AGENT: !Ref UseAgent
        AAHAR_MODEL_PROVIDER: groq
        AAHAR_MODEL_ID: !Ref ModelId
        GROQ_API_KEY: !Ref GroqApiKey
        # Tesseract needs a native binary that a plain Lambda zip cannot carry,
        # so the deployed label reader is Textract. Locally it stays tesseract.
        AAHAR_OCR: textract
  Api:
    Cors:
      AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
      AllowHeaders: "'Content-Type,Authorization,X-Api-Key,X-Aahar-User,X-Aahar-Role,X-Aahar-Household'"
      AllowOrigin: "'*'"

Resources:
  AuthFunction:
    Type: AWS::Serverless::Function
    Metadata:
      # data/ and agent/ live outside CodeUri; see the Makefile.
      BuildMethod: makefile
    Properties:
      # src/, not src/auth/ — the handler imports shared.api like every other
      # entry point, and a package rooted at src/auth/ ships none of it.
      CodeUri: src/
      Handler: auth.app.lambda_handler
      Environment:
        Variables:
          PROFILES_TABLE: !Ref ProfilesTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProfilesTable
      Events:
        # These paths are what frontend/lib/api/client.ts actually calls.
        # They were /api/signup and /api/login, which it never requests.
        Signup:
          Type: Api
          Properties:
            Path: /api/auth/signup
            Method: post
        Signin:
          Type: Api
          Properties:
            Path: /api/auth/signin
            Method: post
        Me:
          Type: Api
          Properties:
            Path: /api/auth/me
            Method: get
        SignupOptions:
          Type: Api
          Properties:
            Path: /api/auth/{proxy+}
            Method: options

  ProfilesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: AaharKavach-Profiles
      AttributeDefinitions:
        - AttributeName: householdId
          AttributeType: S
        - AttributeName: profileId
          AttributeType: S
      KeySchema:
        - AttributeName: householdId
          KeyType: HASH
        - AttributeName: profileId
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST

  HistoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: AaharKavach-ScanHistory
      AttributeDefinitions:
        - AttributeName: householdId
          AttributeType: S
        # Range key is the timestamp so a query returns newest-first directly.
        - AttributeName: timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: householdId
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST

  ExplanationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: AaharKavach-Explanations
      AttributeDefinitions:
        - AttributeName: ingredient
          AttributeType: S
      KeySchema:
        - AttributeName: ingredient
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  ProfilesFunction:
    Type: AWS::Serverless::Function
    Metadata:
      # data/ and agent/ live outside CodeUri; see the Makefile.
      BuildMethod: makefile
    Properties:
      CodeUri: src/
      Handler: profiles.app.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProfilesTable
      Events:
        Collection:
          Type: Api
          Properties:
            Path: /api/profiles
            Method: ANY
        # Edit and delete address a single profile; without this route the
        # frontend's PUT/DELETE 403 at the gateway before reaching Cedar.
        Item:
          Type: Api
          Properties:
            Path: /api/profiles/{id}
            Method: ANY

  ScansFunction:
    Type: AWS::Serverless::Function
    Metadata:
      # data/ and agent/ live outside CodeUri; see the Makefile.
      BuildMethod: makefile
    Properties:
      CodeUri: src/
      Handler: scans.app.lambda_handler
      Policies:
        # Evaluation reads the household before it can judge anything.
        - DynamoDBReadPolicy:
            TableName: !Ref ProfilesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref HistoryTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ExplanationsTable
        - Statement:
            - Effect: Allow
              Action:
                # Reads the ingredients panel from a label photo.
                - textract:DetectDocumentText
              Resource: "*"
      Events:
        BarcodeLookup:
          Type: Api
          Properties:
            Path: /api/scan/barcode
            Method: GET
        ExplainIngredient:
          Type: Api
          Properties:
            Path: /api/explain
            Method: GET
        LabelPhoto:
          Type: Api
          Properties:
            Path: /api/scan/label
            Method: POST
        ScanUrl:
          Type: Api
          Properties:
            Path: /api/scan/url
            Method: POST
        Evaluate:
          Type: Api
          Properties:
            Path: /api/evaluate
            Method: POST
        AuditBatch:
          Type: Api
          Properties:
            Path: /api/audit/batch
            Method: POST

  CompareFunction:
    Type: AWS::Serverless::Function
    Metadata:
      # data/ and agent/ live outside CodeUri; see the Makefile.
      BuildMethod: makefile
    Properties:
      CodeUri: src/
      Handler: compare.app.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ProfilesTable
      Events:
        Compare:
          Type: Api
          Properties:
            Path: /api/compare
            Method: POST

  HistoryFunction:
    Type: AWS::Serverless::Function
    Metadata:
      # data/ and agent/ live outside CodeUri; see the Makefile.
      BuildMethod: makefile
    Properties:
      CodeUri: src/
      Handler: history.app.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref HistoryTable
      Events:
        History:
          Type: Api
          Properties:
            Path: /api/history
            Method: GET

Outputs:
  ApiEndpoint:
    Description: API Gateway base URL — set NEXT_PUBLIC_API_BASE_URL to this
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
  ProfilesTableName:
    Description: DynamoDB table holding household profiles
    Value: !Ref ProfilesTable
  HistoryTableName:
    Description: DynamoDB table holding scan history
    Value: !Ref HistoryTable
